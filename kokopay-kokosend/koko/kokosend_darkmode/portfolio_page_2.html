    .pf-dot.is-active { color:var(--pf-bg); background:var(--pf-ink); border-color:var(--pf-ink); }
    .pf-arrow { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--pf-ink); text-decoration:none; background:#fff; border:1px solid var(--pf-line); padding:8px 16px; border-radius:999px; white-space:nowrap; transition:background .18s ease, color .18s ease, border-color .18s ease; }
    .pf-arrow:hover { background:var(--pf-ink); border-color:var(--pf-ink); color:var(--pf-bg); }
    .pf-arrow--off { opacity:.3; pointer-events:none; }
    .pf-arrow i { font-style:normal; font-size:15px; line-height:1; }

    .pf-frame { margin:0; padding:clamp(14px,2vw,32px); background:#fff; border:1px solid var(--pf-line); border-radius:22px; box-shadow:0 20px 50px rgba(20,18,15,.07); }
    .pf-frame img { width:100%; height:auto; display:block; border:1px solid #ece7df; border-radius:12px; }

    /* ---------- bottom pager ---------- */
    .pf-pager { max-width:1120px; margin:0 auto; padding:0 clamp(20px,4vw,48px) clamp(48px,7vw,88px); display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .pf-pager__btn { display:inline-flex; flex-direction:column; gap:1px; min-width:148px; padding:12px 20px; background:#fff; border:1px solid var(--pf-line); border-radius:14px; text-decoration:none; transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
    .pf-pager__btn:hover { border-color:var(--pf-ink); box-shadow:0 12px 26px rgba(20,18,15,.08); transform:translateY(-2px); }
    .pf-pager__btn--next { margin-left:auto; align-items:flex-end; text-align:right; }

    .pf-hint { font-family:'DM Mono', ui-monospace, monospace; font-size:11px; letter-spacing:.06em; color:var(--pf-muted); text-align:center; }
